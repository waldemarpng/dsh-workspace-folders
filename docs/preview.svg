<svg width="760" height="404" viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dsh-workspace-folders: the New workspace dialog with two folders picked">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <g id="folder">
      <path d="M0 1.5 a1.5 1.5 0 0 1 1.5 -1.5 h4 l2 2 h7 a1.5 1.5 0 0 1 1.5 1.5 v8.5 a1.5 1.5 0 0 1 -1.5 1.5 h-13 a1.5 1.5 0 0 1 -1.5 -1.5 z" fill="none" stroke="#8b8b9c" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <g id="close">
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#8b8b9c" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="760" height="404" rx="16" fill="#14141b"/>

  <g filter="url(#shadow)">
    <rect x="150" y="24" width="460" height="356" rx="14" fill="#20202b" stroke="#2d2d3a" stroke-width="1"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="174" y="62" font-size="16" font-weight="600" fill="#ffffff">New workspace</text>
    <use href="#close" x="578" y="52"/>

    <text x="174" y="98" font-size="12" fill="#8b8b9c">Name</text>
    <rect x="174" y="106" width="412" height="34" rx="8" fill="#191921" stroke="#34344a" stroke-width="1"/>
    <text x="186" y="128" font-size="14" fill="#ffffff">my-workspace</text>

    <text x="174" y="166" font-size="12" fill="#8b8b9c">Folders</text>
    <rect x="174" y="174" width="412" height="96" rx="8" fill="none" stroke="#34344a" stroke-width="1"/>
    <line x1="174" y1="222" x2="586" y2="222" stroke="#2d2d3a" stroke-width="1"/>

    <use href="#folder" x="188" y="191"/>
    <text x="214" y="194" font-size="13" fill="#ffffff">web-app</text>
    <text x="214" y="210" font-size="11" fill="#7c7c8e">~/Projects/web-app</text>
    <use href="#close" x="562" y="194"/>

    <use href="#folder" x="188" y="239"/>
    <text x="214" y="242" font-size="13" fill="#ffffff">api-server</text>
    <text x="214" y="258" font-size="11" fill="#7c7c8e">~/Projects/api-server</text>
    <use href="#close" x="562" y="242"/>

    <rect x="174" y="280" width="104" height="28" rx="6" fill="none" stroke="#3a3a4c" stroke-width="1"/>
    <path d="M188 294 h8 M192 290 v8" stroke="#d7d7e2" stroke-width="1.4" stroke-linecap="round"/>
    <text x="236" y="298" font-size="12" fill="#d7d7e2" text-anchor="middle">Add folder</text>

    <rect x="370" y="324" width="76" height="32" rx="8" fill="none" stroke="#3a3a4c" stroke-width="1"/>
    <text x="408" y="345" font-size="13" fill="#d7d7e2" text-anchor="middle">Cancel</text>
    <rect x="454" y="324" width="132" height="32" rx="8" fill="#4d6bfe"/>
    <text x="520" y="345" font-size="13" fill="#ffffff" text-anchor="middle">Create workspace</text>
  </g>
</svg>
